cartesian_admittance_controller:
  joints:
    type: string_array
    description: "Names of the joints"

  end_effector_frame:
    type: string
    description: "Name of the end-effector frame"

  base_frame:
    type: string
    default_value: ""
    description: "Name of the base/root frame as reference for kinematics computations"

  use_operational_space:
    type: bool
    default_value: False
    description: "Whether we use operational space control or cartesian impedance control"

  operational_space_regularization:
    type: double
    default_value: 0.01
    description: "Regularization (damping) for Mx pseudo-inverse. Higher values improve stability near singularities but reduce accuracy. Valid range is 0.001-1.0; typical useful values are in the 0.01-0.5 range."
    validation:
      bounds<>: [0.001, 1.0]

  task:
    k_pos_x:
      type: double
      default_value: 500.0
      description: "Stiffness in the x direction for the translation"
      validation:
        bounds<>: [0.0, 5000.0]
    d_pos_x:
      type: double
      default_value: -1.0
      description: "Damping in the x direction for the translation. If negative, computed as 2*sqrt(stiffness)"
      validation:
        bounds<>: [-1.0, 5000.0]
    k_pos_y:
      type: double
      default_value: 500.0
      description: "Stiffness in the y direction for the translation"
      validation:
        bounds<>: [0.0, 5000.0]
    d_pos_y:
      type: double
      default_value: -1.0
      description: "Damping in the y direction for the translation. If negative, computed as 2*sqrt(stiffness)"
      validation:
        bounds<>: [-1.0, 5000.0]
    k_pos_z:
      type: double
      default_value: 500.0
      description: "Stiffness in the z direction for the translation"
      validation:
        bounds<>: [0.0, 5000.0]
    d_pos_z:
      type: double
      default_value: -1.0
      description: "Damping in the z direction for the translation. If negative, computed as 2*sqrt(stiffness)"
      validation:
        bounds<>: [-1.0, 5000.0]
    k_rot_x:
      type: double
      default_value: 30.0
      description: "Stiffness in the x direction for the orientation"
      validation:
        bounds<>: [0.0, 5000.0]
    d_rot_x:
      type: double
      default_value: -1.0
      description: "Damping in the x direction for the orientation. If negative, computed as 2*sqrt(stiffness)"
      validation:
        bounds<>: [-1.0, 5000.0]
    k_rot_y:
      type: double
      default_value: 30.0
      description: "Stiffness in the y direction for the orientation"
      validation:
        bounds<>: [0.0, 5000.0]
    d_rot_y:
      type: double
      default_value: -1.0
      description: "Damping in the y direction for the orientation. If negative, computed as 2*sqrt(stiffness)"
      validation:
        bounds<>: [-1.0, 5000.0]
    k_rot_z:
      type: double
      default_value: 30.0
      description: "Stiffness in the z direction for the orientation"
      validation:
        bounds<>: [0.0, 5000.0]
    d_rot_z:
      type: double
      default_value: -1.0
      description: "Damping in the z direction for the orientation. If negative, computed as 2*sqrt(stiffness)"
      validation:
        bounds<>: [-1.0, 5000.0]
    error_clip:
      x:
        type: double
        description: "Max allowed error in x direction."
        default_value: 0.1
      y:
        type: double
        description: "Max allowed error in y direction."
        default_value: 0.1
      z:
        type: double
        description: "Max allowed error in z direction."
        default_value: 0.1
      rx:
        type: double
        description: "Max allowed error in the rotational x direction (local or global frame)."
        default_value: 0.5
      ry:
        type: double
        description: "Max allowed error in the rotational y direction (local or global frame)."
        default_value: 0.5
      rz:
        type: double
        description: "Max allowed error in the rotational z direction (local or global frame)."
        default_value: 0.5

  nullspace:
    stiffness:
      type: double
      default_value: 1.0
      description: "Stiffness of the nullspace controller."
      validation:
        bounds<>: [0.0, 500.0]
    damping:
      type: double
      default_value: -1.0
      description: "Damping of the nullspace controller. If negative, then 2 sqrt(stiffness) is used."
      validation:
        bounds<>: [-1.0, 500.0]
    weights:
      __map_joints:
        value:
          type: double
          default_value: 1.0
          description: "Weights for each joint for the nullspace parameters."
          validation:
            bounds<>: [0.0, 500.0]
    regularization:
      type: double
      default_value: 0.000001
      description: "Regularization value for the pseudo-inverse."
      validation:
        bounds<>: [0.000001, 0.0001]
    projector_type:
      type: string
      default_value: "kinematic"
      description: "Which type of nullspace projector should be used: kinematic, dynamic or none."
      validation:
        one_of<>: [["kinematic", "dynamic", "none"]]
    max_tau:
      type: double
      default_value: 5
      description: "Maximal torque value that can be applied in the nullspace. This is used to be sure that we do not interfere with the main task."

  noise:
    add_random_noise:
      type: bool
      default_value: false
      description: "Whether or not we add random noise to the torques. This is just to test for stability."
    amplitude:
      type: double
      default_value: 0.0
      description: "Magnitude of the added noise, if added."
      validation:
        bounds<>: [0.0, 10.0]


  use_friction:
    type: bool
    default_value: false
    description: "Use friction compensation"

  use_coriolis_compensation:
    type: bool
    default_value: false
    description: "Use coriolis compensation"

  use_gravity_compensation:
    type: bool
    default_value: false
    description: "Add use_gravity_compensation. Double check that your robot is not already doing this behind the scenes (which is the case for Franka Robotics). In this case you should leave this parameter to false!"

  use_local_jacobian:
    type: bool
    default_value: false
    description: "If true, we use the local jacobian for computations, otherwise we use the world jacobian."

  log:
    enabled:
      type: bool
      default_value: false
      description: "If set so to true, log some debugging statements."
    robot_state:
      type: bool
      default_value: false
      description: "If set so to true, log the robot state like the joint state and end effector position."
    control_values:
      type: bool
      default_value: false
      description: "If set so to true, log the control values like error to target."
    limits:
      type: bool
      default_value: false
      description: "If set so to true, log the limits of each joint."
    controller_parameters:
      type: bool
      default_value: false
      description: "If set so to true, log the controller parameters like the stiffness, damping..."
    computed_torques:
      type: bool
      default_value: false
      description: "If set so to true, log the individual computed torques."
    dynamic_params:
      type: bool
      default_value: false
      description: "If set so to true, log the dynamic_params like the mass matrix, operational mass matrix..."
    timing:
      type: bool
      default_value: false
      description: "If true, the time required by the loop will be displayed."

  filter:
    target_pose:
      type: double
      default_value: 0.1
      description: "EMA smoothing factor for the target pose (position and orientation). 0=no filtering, 1=never updates."
      validation:
        bounds<>: [0.0, 1.0]
    q:
      type: double
      default_value: 0.5
      description: "EMA smoothing factor for measured joint positions. 0=no filtering, 1=never updates."
      validation:
        bounds<>: [0.0, 1.0]
    dq:
      type: double
      default_value: 0.5
      description: "EMA smoothing factor for measured joint velocities. 0=no filtering, 1=never updates."
      validation:
        bounds<>: [0.0, 1.0]
    q_ref:
      type: double
      default_value: 0.5
      description: "EMA smoothing factor for the reference joint position (nullspace target). 0=no filtering, 1=never updates."
      validation:
        bounds<>: [0.0, 1.0]

    output_torque:
      type: double
      default_value: 0.5
      description: "EMA smoothing factor for the output torque. 0=no filtering, 1=never updates."
      validation:
        bounds<>: [0.0, 1.0]

  limit_error:
    type: bool
    default_value: true
    description: "Limit\\clamp the error computed as the difference between the current pose and target pose."

  pose_safety:
    # ── Timeout / watchdog ──────────────────────────────────────────────────
    # If no target pose is received for longer than `timeout.seconds`, the
    # controller freezes the target at the current end-effector position so
    # the robot holds still instead of driving toward a stale goal.
    timeout:
      enabled:
        type: bool
        default_value: true
        description: "If true, reset the target pose to the current end-effector position when no valid pose has been received for longer than `pose_safety.timeout.seconds`."
      seconds:
        type: double
        default_value: 0.5
        description: "Maximum allowed time (s) since the last received target pose. If exceeded, the target freezes at the current end-effector position."
        validation:
          bounds<>: [0.0, 60.0]

    # ── NaN / Inf guard ─────────────────────────────────────────────────────
    # Malformed values from a buggy publisher would corrupt the control
    # computation — this guard discards such messages before they are applied.
    nan_check:
      enabled:
        type: bool
        default_value: true
        description: "If true, reject any target pose message that contains NaN or infinite values in position or orientation."

    # ── Maximum distance guard ───────────────────────────────────────────────
    # Prevents large instantaneous jumps in the commanded target position
    # (e.g. from a re-started or mis-configured publisher).
    max_distance:
      enabled:
        type: bool
        default_value: false
        description: "If true, reject target poses whose Euclidean distance from the current end-effector position exceeds `pose_safety.max_distance.meters`."
      meters:
        type: double
        default_value: 1.0
        description: "Maximum allowed distance (m) between the incoming target position and the current end-effector position."
        validation:
          bounds<>: [0.0, 10.0]

  limit_torques:
    type: bool
    default_value: true
    description: "Limit torques"

  joint_limit_repulsion:
    enabled:
      type: bool
      default_value: true
      description: "Enable joint limit repulsion torques that push joints away from their limits"
    safe_range:
      type: double
      default_value: 0.1
      description: "Distance from joint limit where repulsion starts [rad]"
      validation:
        bounds<>: [0.01, 1.0]
    max_torque:
      type: double
      default_value: 5.0
      description: "Maximum repulsion torque at joint limit [Nm]"
      validation:
        bounds<>: [0.0, 50.0]

  max_delta_tau:
    type: double
    default_value: 0.5
    description: "Max allowed change in torque per joint per control loop."

  stop_commands:
    type: bool
    default_value: False
    description: "If set to true, we will stop sending commands to the robot. This is mainly for debugging useful."

  friction:
    model_type:
      type: string
      default_value: "sigmoidal"
      description: >
        Friction model type.
        'sigmoidal': 3-param model f(dq)=fp1/(1+exp(-fp2*(dq+fp3)))-fp1/(1+exp(-fp2*fp3))
        from Cognetti, FrankaEmikaPandaDynModel.
        'sigmoidal_viscous': 5-param model f(dq)=f_v*dq+f_o+f_c/(1+exp(-alpha*(dq+ni)))
        from Petrone et al., arXiv:2502.11940, IEEE Trans. Ind. Informatics 2025.
        'stribeck': 4-param model f(dq)=tanh(k*dq)*(f_c+(f_s-f_c)*exp(-(dq/v_s)^2))
        +f_v*dq. Captures the breakaway peak (f_s) above the kinetic Coulomb (f_c)
        with viscous f_v and Stribeck width v_s. Per-joint smoothing sharpness k.
      validation:
        one_of<>: [["sigmoidal", "sigmoidal_viscous", "stribeck"]]
    # --- 3-param sigmoidal model (Franka default) ---
    fp1:
      type: double_array
      default_value: [0.54615, 0.87224, 0.64068, 1.2794, 0.83904, 0.30301, 0.56489]
      description: "Sigmoidal model: amplitude per joint. Default: Franka Emika Panda (7 joints)."
    fp2:
      type: double_array
      default_value: [ 5.1181, 9.0657, 10.136, 5.5903, 8.3469, 17.133, 10.336]
      description: "Sigmoidal model: steepness per joint. Default: Franka Emika Panda (7 joints)."
    fp3:
      type: double_array
      default_value: [ 0.039533, 0.025882, -0.04607, 0.036194, 0.026226, -0.021047, 0.0035526]
      description: "Sigmoidal model: velocity shift per joint. Default: Franka Emika Panda (7 joints)."
    # --- 5-param sigmoidal+viscous model ---
    # Reference: Petrone, Ferrentino, Chiacchio, "The Dynamic Model of the UR10 Robot
    # and its ROS2 Integration", arXiv:2502.11940, IEEE Trans. Ind. Informatics, 2025.
    # Code: https://github.com/unisa-acg/inverse-dynamics-solver
    # NOTE: Published values are for the UR10 CB3. For UR10e, these should be re-identified.
    # Values must be in torque domain (multiply current-domain params by motor gain K_i).
    f_v:
      type: double_array
      default_value: []
      description: "Sigmoidal+viscous model: viscous friction coefficient per joint [Nm*s/rad]."
    f_o:
      type: double_array
      default_value: []
      description: "Sigmoidal+viscous model: friction offset per joint [Nm]."
    f_c:
      type: double_array
      default_value: []
      description: "Sigmoidal+viscous model: Coulomb friction amplitude per joint [Nm]."
    alpha:
      type: double_array
      default_value: []
      description: "Sigmoidal+viscous model: sigmoid steepness per joint [s/rad]."
    ni:
      type: double_array
      default_value: []
      description: "Sigmoidal+viscous model: velocity shift per joint [rad/s]."
    # --- 4-param Stribeck model (chatter-free via per-joint tanh smoothing) ---
    # f(dq) = tanh(k*dq) * (f_c + (f_s - f_c) * exp(-(dq/v_s)^2)) + f_v * dq
    # Identify on a slow constant-velocity sweep (ddq ~ 0, gravity-subtracted).
    stribeck:
      f_c:
        type: double_array
        default_value: []
        description: "Stribeck: kinetic Coulomb friction per joint [Nm]."
      f_s:
        type: double_array
        default_value: []
        description: "Stribeck: breakaway / static-friction asymptote per joint [Nm]. f_s >= f_c."
      v_s:
        type: double_array
        default_value: []
        description: "Stribeck: characteristic Stribeck velocity per joint [rad/s]. Must be > 0."
      f_v:
        type: double_array
        default_value: []
        description: "Stribeck: viscous coefficient per joint [Nm*s/rad]."
      k:
        type: double_array
        default_value: []
        description: >
          Stribeck: tanh sign-smoothing sharpness per joint [1/(rad/s)].
          Leave empty to default to k_j = 5/v_s_j (smoothing band 1/k_j is 1/5
          of the Stribeck width v_s_j, so the dip is preserved).

  variable_max_impedance_stiffness:
    translational:
      type: double
      default_value: 900.0
      description: "Maximum allowed translational stiffness value. Stiffness values above this will be clamped."
      validation:
        bounds<>: [0.0, 5000.0]
    rotational:
      type: double
      default_value: 60.0
      description: "Maximum allowed rotational stiffness value. Stiffness values above this will be clamped."
      validation:
        bounds<>: [0.0, 100.0]

  variable_stiffness:
    enabled:
      type: bool
      default_value: false
      description: "Enable receiving stiffness updates via a ROS2 topic. When enabled, stiffness values from the topic override parameter-based stiffness."
    topic:
      type: string
      default_value: "target_stiffness"
      description: "Topic name for receiving variable stiffness updates (std_msgs/Float64MultiArray with 6 elements: [k_pos_x, k_pos_y, k_pos_z, k_rot_x, k_rot_y, k_rot_z])"

  enable_introspection:
    type: bool
    default_value: false
    description: "Whether or not to enable introspection for this controller. This will allow us to visualize the internal state of the controller in plotjuggler using the introspection topics."

  admittance:
    mass_x:
      type: double
      default_value: 1.0
      description: "Virtual mass for admittance in x translation"
      validation:
        bounds<>: [0.001, 100.0]
    mass_y:
      type: double
      default_value: 1.0
      description: "Virtual mass for admittance in y translation"
      validation:
        bounds<>: [0.001, 100.0]
    mass_z:
      type: double
      default_value: 1.0
      description: "Virtual mass for admittance in z translation"
      validation:
        bounds<>: [0.001, 100.0]
    mass_rx:
      type: double
      default_value: 0.1
      description: "Virtual mass for admittance in x rotation"
      validation:
        bounds<>: [0.001, 100.0]
    mass_ry:
      type: double
      default_value: 0.1
      description: "Virtual mass for admittance in y rotation"
      validation:
        bounds<>: [0.001, 100.0]
    mass_rz:
      type: double
      default_value: 0.1
      description: "Virtual mass for admittance in z rotation"
      validation:
        bounds<>: [0.001, 100.0]
    stiffness_x:
      type: double
      default_value: 200.0
      description: "Admittance stiffness in x translation"
      validation:
        bounds<>: [0.0, 5000.0]
    stiffness_y:
      type: double
      default_value: 200.0
      description: "Admittance stiffness in y translation"
      validation:
        bounds<>: [0.0, 5000.0]
    stiffness_z:
      type: double
      default_value: 200.0
      description: "Admittance stiffness in z translation"
      validation:
        bounds<>: [0.0, 5000.0]
    stiffness_rx:
      type: double
      default_value: 10.0
      description: "Admittance stiffness in x rotation"
      validation:
        bounds<>: [0.0, 5000.0]
    stiffness_ry:
      type: double
      default_value: 10.0
      description: "Admittance stiffness in y rotation"
      validation:
        bounds<>: [0.0, 5000.0]
    stiffness_rz:
      type: double
      default_value: 10.0
      description: "Admittance stiffness in z rotation"
      validation:
        bounds<>: [0.0, 5000.0]
    damping_x:
      type: double
      default_value: 50.0
      description: "Admittance damping in x translation"
      validation:
        bounds<>: [0.0, 5000.0]
    damping_y:
      type: double
      default_value: 50.0
      description: "Admittance damping in y translation"
      validation:
        bounds<>: [0.0, 5000.0]
    damping_z:
      type: double
      default_value: 50.0
      description: "Admittance damping in z translation"
      validation:
        bounds<>: [0.0, 5000.0]
    damping_rx:
      type: double
      default_value: 5.0
      description: "Admittance damping in x rotation"
      validation:
        bounds<>: [0.0, 5000.0]
    damping_ry:
      type: double
      default_value: 5.0
      description: "Admittance damping in y rotation"
      validation:
        bounds<>: [0.0, 5000.0]
    damping_rz:
      type: double
      default_value: 5.0
      description: "Admittance damping in z rotation"
      validation:
        bounds<>: [0.0, 5000.0]

  ft_sensor:
    topic:
      type: string
      default_value: "ft_sensor_wrench"
      description: "Topic name for external force/torque sensor (geometry_msgs/WrenchStamped)"
    frame:
      type: string
      default_value: ""
      description: "Name of the F/T sensor measurement frame in the URDF. If empty, defaults to end_effector_frame (legacy behavior)."

  variable_max_admittance_stiffness:
    translational:
      type: double
      default_value: 900.0
      description: "Maximum allowed translational admittance stiffness value. Values above this will be clamped."
      validation:
        bounds<>: [0.0, 5000.0]
    rotational:
      type: double
      default_value: 60.0
      description: "Maximum allowed rotational admittance stiffness value. Values above this will be clamped."
      validation:
        bounds<>: [0.0, 100.0]

  variable_admittance_stiffness:
    enabled:
      type: bool
      default_value: false
      description: "Enable receiving admittance stiffness updates via a ROS2 topic"
    topic:
      type: string
      default_value: "target_admittance_stiffness"
      description: "Topic name for variable admittance stiffness (Float64MultiArray, 6 elements)"
